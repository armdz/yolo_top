# Publica el release cuando se sube un tag v* (ej. git tag v1.0.1 && git push origin v1.0.1).
# No compila nada: sube la DLL ya compilada que esta en el repo (build.bat la deja en
# native/YoloSegTOP/build/YoloSegTOP.dll), el modelo y get_directml.bat.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: softprops/action-gh-release@v2
        with:
          name: YOLO Seg Track ${{ github.ref_name }}
          body_path: .github/release_notes.md
          fail_on_unmatched_files: true
          files: |
            native/YoloSegTOP/build/YoloSegTOP.dll
            models/yolo26n-seg.onnx
            native/YoloSegTOP/scripts/get_directml.bat
